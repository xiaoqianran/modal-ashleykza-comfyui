[project]
name = "modal-ashleykza-comfyui"
version = "0.3.0"
description = "Reproducible ComfyUI recipes and Modal Storage hydrate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal",
]

[project.scripts]
studio = "studio.server:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "base_nodes",
    "catalog",
    "comfy_engine",
    "comfyui_modal",
    "gallery_hub",
    "modal_config",
    "recipes",
    "sam3d_runtime",
    "sparse_3d_runtime",
    "storage",
    "studio",
    "template_analyzer",
    "uv_runtime",
    "workflow_queue",
    "workflow_resolver",
]
