[project]
name = "modal-ashleykza-comfyui"
version = "0.2.0"
description = "Reproducible ComfyUI recipes and workflow prefetching on Modal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal==1.5.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
