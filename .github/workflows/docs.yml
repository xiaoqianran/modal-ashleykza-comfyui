# Publish MkDocs + Hugging Face gallery snapshot to GitHub Pages.
name: Deploy documentation

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HF_GALLERY_REPO: seachen/modal-comfyui-picture

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install MkDocs
        run: python -m pip install --upgrade pip && python -m pip install -r docs/requirements.txt

      - name: Pull Hugging Face gallery
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install "huggingface_hub>=0.26" "pillow>=10"
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN missing; building docs with empty gallery placeholder"
            exit 0
          fi
          python -m gallery_hub.pull --repo "$HF_GALLERY_REPO" --out .cache/hf-gallery
          python -m gallery_hub.report --src .cache/hf-gallery --repo "$HF_GALLERY_REPO" --require-items
          python -m gallery_hub.build_pages --src .cache/hf-gallery --docs-gallery docs/gallery --repo "$HF_GALLERY_REPO"

      - name: Build
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
