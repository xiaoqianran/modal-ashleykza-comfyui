name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile base_nodes.py recipes.py comfy_engine.py comfyui_modal.py tests/test_recipes.py
      - run: pytest -q
