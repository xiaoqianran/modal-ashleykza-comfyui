name: Studio Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub Release with Studio.exe"
        type: boolean
        default: false
  push:
    tags:
      - "studio-v*"
  pull_request:
    paths:
      - "packaging/**"
      - "studio/**"
      - "catalog/**"
      - "examples/**"
      - "hydrate_modal.py"
      - "comfyui_modal.py"
      - "recipes.py"
      - "workflow_queue.py"
      - "modal_ops.py"
      - ".github/workflows/studio-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Studio.exe
        run: python packaging/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Studio
          path: dist/Studio.exe
          if-no-files-found: error
      - name: Publish draft from workflow_dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-windows-${{ github.run_number }}
          name: Studio Windows ${{ github.run_number }}
          draft: true
          files: dist/Studio.exe
          body: |
            只下载这一个 `Studio.exe`，双击即可。不要再解一堆目录。
            第一次会把运行时写到 `%LOCALAPPDATA%\ComfyStudio`。
            需要本机联网、Modal 账号、Hugging Face token。
            走代理：设 `HTTPS_PROXY` / `ALL_PROXY`（内置 `modal[api-proxy-support]`）。
            工作流配方还需要本机 Chrome 或 Edge。GPU 仍在 Modal 上。
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/studio-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Studio.exe
          body: |
            只下载这一个 `Studio.exe`，双击即可。不要再解一堆目录。
            第一次会把运行时写到 `%LOCALAPPDATA%\ComfyStudio`。
            需要本机联网、Modal 账号、Hugging Face token。
            走代理：设 `HTTPS_PROXY` / `ALL_PROXY`（内置 `modal[api-proxy-support]`）。
            工作流配方还需要本机 Chrome 或 Edge。GPU 仍在 Modal 上。
